services:
  api:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - path: .env
        required: false
    environment:
      GSTLENS_ADAPTER_PATH: /app/artifacts/qwen05b-lora/adapter
    volumes:
      - ./artifacts:/app/artifacts:ro
      - hf-cache:/models
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  web:
    build: ./web
    ports:
      - "5173:80"
    depends_on:
      - api

volumes:
  hf-cache:
