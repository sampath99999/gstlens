[project]
name = "gstlens"
version = "0.1.0"
description = "Fine-tuning a small open model to extract structured fields from Indian GST invoices"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "faker>=30.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
]

[project.optional-dependencies]
ml = [
    "torch==2.6.0",
    "transformers>=4.51",
    "peft>=0.15",
    "accelerate>=1.2",
]
ollama = ["openai>=1.60"]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx>=0.28",
    "ruff>=0.8",
]

[project.scripts]
gstlens-data = "gstlens.data.build:main"
gstlens-train = "gstlens.training.train:main"
gstlens-eval = "gstlens.evaluation.run:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gstlens"]

[tool.uv.sources]
torch = { index = "pytorch-cu126" }

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
